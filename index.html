<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelvyn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'EB Garamond', 'Garamond', 'Times New Roman', serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            margin: 0;
            background-image: radial-gradient(circle at 30% 30%, #1a1a1a 0%, #0a0a0a 80%);
        }

        .container {
            max-width: 880px;
            width: 100%;
            text-align: center;
            padding: 3rem 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 32px;
            backdrop-filter: blur(2px);
            background: rgba(255, 255, 255, 0.015);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .hero-title {
            font-size: 5.5rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            line-height: 1.1;
            color: #ffffff;
            text-shadow: 0 2px 30px rgba(255, 255, 255, 0.08);
            margin-bottom: 2.5rem;
        }

        .hero-title .nome {
            color: #f0ede6;
            font-weight: 700;
            letter-spacing: 0.08em;
            background: linear-gradient(180deg, #ffffff 25%, #b8b4ab 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #5a5750, transparent);
            margin: 0 auto 2.5rem;
        }

        .social {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
        }

        .social a {
            color: #b5b1a8;
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 400;
            letter-spacing: 0.04em;
            transition: all 0.3s ease;
            padding: 0.4rem 0.8rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(255, 255, 255, 0.01);
        }

        .social a:hover {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.04);
            transform: translateY(-2px);
        }

        .bio {
            max-width: 580px;
            margin: 0 auto 2rem;
            color: #b5b1a8;
            font-size: 1.1rem;
            line-height: 1.8;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        .bio strong {
            color: #e8e4db;
            font-weight: 600;
        }

        .email {
            display: inline-block;
            color: #8a8780;
            text-decoration: none;
            font-size: 1.05rem;
            letter-spacing: 0.06em;
            padding: 0.5rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 40px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.01);
        }

        .email:hover {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.03);
            transform: translateY(-2px);
        }

        .email .icon {
            display: inline-block;
            margin-right: 0.5rem;
            font-style: normal;
        }

        @media (max-width: 600px) {
            .container {
                padding: 2rem 1.2rem;
                border-radius: 24px;
            }
            .hero-title {
                font-size: 3.8rem;
                margin-bottom: 2rem;
            }
            .social {
                gap: 1rem;
                margin-bottom: 2rem;
            }
            .social a {
                font-size: 1rem;
                padding: 0.3rem 0.7rem;
            }
            .bio {
                font-size: 1rem;
                padding: 0 0.5rem;
            }
            .email {
                font-size: 0.95rem;
                padding: 0.4rem 1rem;
            }
        }

        @media (max-width: 420px) {
            .hero-title {
                font-size: 2.8rem;
                margin-bottom: 1.5rem;
            }
            .social {
                flex-direction: column;
                align-items: center;
                gap: 0.7rem;
            }
            .social a {
                width: 80%;
                text-align: center;
            }
            .bio {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="hero-title">
            <span class="nome">Kelvyn</span>
        </h1>

        <div class="divider"></div>

        <div class="social">
            <a href="https://www.instagram.com/sant.osz4279/" target="_blank">Instagram</a>
            <a href="https://x.com/gidbzy" target="_blank">Twitter</a>
            <a href="https://github.com/finanflow350-maker" target="_blank">GitHub</a>
            <a href="https://www.linkedin.com/in/kelvyn-amaral-8b108a324/" target="_blank">LinkedIn</a>
        </div>

        <div class="bio">
            <strong>Kelvyn</strong> — jovem empreendedor brasileiro com interesse em tecnologia, negócios, finanças e inovação. Atua no desenvolvimento de soluções voltadas à gestão e automação, buscando eficiência, organização e crescimento sustentável.
        </div>

        <a href="mailto:santosz.s@icloud.com" class="email">
            <span class="icon">✉</span> santosz.s@icloud.com
        </a>
    </div>
</body>
</html>
